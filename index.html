<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ZeroSpend</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --safe-bottom: env(safe-area-inset-bottom, 24px);
      --safe-top: env(safe-area-inset-top, 16px);
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .phone-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      height: 100dvh;
      background: #000000;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* PANTALLA DE BLOQUEO POR PIN */
    #pinScreen {
      position: absolute;
      inset: 0;
      background: #000000;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(30px + var(--safe-top)) 24px calc(24px + var(--safe-bottom)) 24px;
    }

    .pin-top-tag {
      font-size: 11px;
      letter-spacing: 2px;
      color: #888888;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .red-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d71920;
    }

    .pin-dots {
      display: flex;
      gap: 16px;
      margin: 24px 0 10px 0;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #555555;
      transition: all 0.15s ease;
    }

    .pin-dot.active {
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    .keypad-btn {
      height: 62px;
      border-radius: 32px;
      background: #141414;
      border: 1px solid #282828;
      color: #ffffff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .keypad-btn:active {
      background: #333333 !important;
      transform: scale(0.96);
    }

    .keypad-btn.action-btn {
      font-size: 11px;
      letter-spacing: 1px;
      color: #999999;
      border: none;
      background: transparent;
    }

    /* BARRA SUPERIOR */
    .app-header {
      padding: calc(12px + var(--safe-top)) 20px 14px 20px;
      border-bottom: 1px solid #1c1c1c;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #282828;
      background: #141414;
      color: #bbbbbb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:active {
      background: #2a2a2a;
      color: #ffffff;
    }

    /* CONTENIDO PRINCIPAL */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px calc(40px + var(--safe-bottom)) 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .balance-card {
      background: #121212;
      border: 1px solid #282828;
      border-radius: 24px;
      padding: 22px;
    }

    .balance-amount {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 8px 0 16px 0;
      color: #ffffff;
    }

    .dual-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid #222222;
    }

    .action-big-btn {
      width: 100%;
      padding: 17px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .action-big-btn:active {
      transform: scale(0.98);
      background: #e2e2e2;
    }

    .tx-item {
      background: #121212;
      border: 1px solid #242424;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    /* MODAL DE 3 PASOS */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      z-index: 40;
      display: flex;
      align-items: flex-end;
    }

    .modal-content {
      width: 100%;
      background: #111111;
      border-top: 1px solid #2d2d2d;
      border-radius: 28px 28px 0 0;
      padding: 20px 20px calc(24px + var(--safe-bottom)) 20px;
      max-height: 85%;
      overflow-y: auto;
    }

    .flow-step-1 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 20px 0 14px 0;
    }

    .type-card {
      height: 125px;
      border-radius: 20px;
      background: #161616;
      border: 1px solid #2c2c2c;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .type-card:active {
      border-color: #ffffff;
      background: #222222;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
      max-height: 250px;
      overflow-y: auto;
    }

    .cat-btn {
      background: #161616;
      border: 1px solid #282828;
      border-radius: 16px;
      padding: 14px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #dddddd;
      cursor: pointer;
    }

    .cat-btn:active {
      border-color: #ffffff;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="phone-container">

    <!-- PANTALLA DE PIN -->
    <div id="pinScreen">
      <div class="pin-top-tag">
        <span class="red-dot"></span> ZEROSPEND // SECURE
      </div>

      <div style="display:flex; flex-direction:column; align-items:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#aaaaaa" stroke-width="2" style="margin-bottom:12px;">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <h2 id="pinTitle" style="font-size:18px; font-weight:600;">Crea tu PIN de 4 dígitos</h2>
        <p id="pinSub" style="font-size:11px; color:#888888; margin-top:4px;">Acceso local privado</p>
        
        <div class="pin-dots">
          <div id="pdot-0" class="pin-dot"></div>
          <div id="pdot-1" class="pin-dot"></div>
          <div id="pdot-2" class="pin-dot"></div>
          <div id="pdot-3" class="pin-dot"></div>
        </div>
        <p id="pinError" style="font-size:12px; color:#d71920; height:16px;"></p>
      </div>

      <!-- Teclado PIN -->
      <div class="keypad-grid">
        <button type="button" class="keypad-btn" onclick="pressPin('1')">1</button>
        <button type="button" class="keypad-btn" onclick="pressPin('2')">2</button>
        <button type="button" class="keypad-btn" onclick="pressPin('3')">3</button>
        <button type="button" class="keypad-btn" onclick="pressPin('4')">4</button>
        <button type="button" class="keypad-btn" onclick="pressPin('5')">5</button>
        <button type="button" class="keypad-btn" onclick="pressPin('6')">6</button>
        <button type="button" class="keypad-btn" onclick="pressPin('7')">7</button>
        <button type="button" class="keypad-btn" onclick="pressPin('8')">8</button>
        <button type="button" class="keypad-btn" onclick="pressPin('9')">9</button>
        <button type="button" class="keypad-btn action-btn" onclick="clearPin()">BORRAR</button>
        <button type="button" class="keypad-btn" onclick="pressPin('0')">0</button>
        <button type="button" class="keypad-btn action-btn" onclick="delPin()">⌫</button>
      </div>
    </div>

    <!-- BARRA SUPERIOR -->
    <header class="app-header">
      <div>
        <div style="font-size:10px; color:#888888; letter-spacing:1.5px;">ZEROSPEND // OS</div>
        <div style="font-size:16px; font-weight:700;">MI BILLETERA</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" onclick="lockScreen()" title="Bloquear con PIN">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="main-content">
      <!-- Balance -->
      <div class="balance-card">
        <div style="font-size:11px; color:#888888; text-transform:uppercase; letter-spacing:1px;">Saldo Disponible</div>
        <div id="balanceText" class="balance-amount">0.00 €</div>
        <div class="dual-stats">
          <div>
            <span style="font-size:11px; color:#22c55e;">● INGRESOS</span>
            <div id="incText" style="font-size:14px; font-weight:600; color:#22c55e; margin-top:2px;">+0.00 €</div>
          </div>
          <div>
            <span style="font-size:11px; color:#d71920;">● GASTOS</span>
            <div id="expText" style="font-size:14px; font-weight:600; color:#d71920; margin-top:2px;">-0.00 €</div>
          </div>
        </div>
      </div>

      <!-- Botón Registrar -->
      <button class="action-big-btn" onclick="openFlow()">
        <span style="font-size:18px;">+</span> REGISTRAR MOVIMIENTO
      </button>

      <!-- Historial -->
      <div>
        <div style="font-size:11px; color:#888888; letter-spacing:1px; margin-bottom:10px; display:flex; justify-content:space-between;">
          <span>HISTORIAL</span>
          <span id="historyCount">0 registros</span>
        </div>
        <div id="txListContainer"></div>
      </div>
    </main>

    <!-- MODAL DE 3 PASOS -->
    <div id="flowModal" class="modal-overlay hidden">
      <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222222; padding-bottom:14px;">
          <span id="modalStepTag" style="font-size:11px; font-weight:700; background:#ffffff; color:#000000; padding:3px 10px; border-radius:12px;">PASO 1 / 3</span>
          <button onclick="closeFlow()" style="background:none; border:none; color:#888888; font-size:20px; cursor:pointer; padding:4px;">✕</button>
        </div>

        <!-- Paso 1 -->
        <div id="flowStep1" class="flow-step-1">
          <div class="type-card" onclick="setFlowType('expense')">
            <span style="color:#d71920; font-size:26px;">↘</span>
            <div>
              <div style="font-size:11px; color:#888888;">SALIDA</div>
              <div style="font-size:17px; font-weight:700;">GASTO</div>
            </div>
          </div>
          <div class="type-card" onclick="setFlowType('income')">
            <span style="color:#22c55e; font-size:26px;">↖</span>
            <div>
              <div style="font-size:11px; color:#888888;">ENTRADA</div>
              <div style="font-size:17px; font-weight:700;">INGRESO</div>
            </div>
          </div>
        </div>

        <!-- Paso 2 -->
        <div id="flowStep2" class="hidden">
          <p style="font-size:12px; color:#999999; margin:16px 0 8px 0;">Elige la carpeta correspondiente:</p>
          <div id="catGrid" class="categories-grid"></div>
          <button onclick="setStep(1)" style="width:100%; padding:12px; background:#181818; border:1px solid #333333; color:#aaaaaa; border-radius:12px; font-size:11px; cursor:pointer;">← ATRÁS</button>
        </div>

        <!-- Paso 3 -->
        <div id="flowStep3" class="hidden">
          <div style="background:#161616; border:1px solid #2a2a2a; border-radius:18px; padding:14px; text-align:center; margin:14px 0;">
            <div id="step3Label" style="font-size:11px; color:#888888;">CARPETA</div>
            <div id="step3Amount" style="font-size:32px; font-weight:700; margin:6px 0;">0.00 €</div>
            <input type="text" id="txNoteInput" placeholder="Nota opcional (ej: Cena)" style="width:90%; background:transparent; border:none; border-bottom:1px solid #333333; color:#eeeeee; text-align:center; font-size:13px; padding:6px;" />
          </div>

          <!-- Teclado para importe -->
          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('1')">1</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('2')">2</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('3')">3</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('4')">4</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('5')">5</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('6')">6</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('7')">7</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('8')">8</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('9')">9</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('.')">.</button>
            <button type="button" class="keypad-btn" style="height:48px; font-size:18px;" onclick="addPad('0')">0</button>
            <button type="button" class="keypad-btn action-btn" style="height:48px;" onclick="delPad()">⌫</button>
          </div>

          <div style="display:flex; gap:8px; margin-top:14px;">
            <button onclick="setStep(2)" style="flex:1; padding:13px; background:#181818; border:1px solid #333333; color:#aaaaaa; border-radius:12px; font-size:11px; cursor:pointer;">ATRÁS</button>
            <button onclick="saveTransaction()" style="flex:2; padding:13px; background:#ffffff; color:#000000; font-weight:700; border:none; border-radius:12px; font-size:11px; cursor:pointer;">CONFIRMAR</button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const DEFAULT_CATS = {
      expense: [
        { name: 'Comida', icon: '🍔' },
        { name: 'Transporte', icon: '🚗' },
        { name: 'Casa', icon: '🏠' },
        { name: 'Ocio', icon: '🍿' },
        { name: 'Compras', icon: '🛍️' },
        { name: 'Salud', icon: '💊' }
      ],
      income: [
        { name: 'Nómina', icon: '💼' },
        { name: 'Extras', icon: '✨' },
        { name: 'Ventas', icon: '🏷️' }
      ]
    };

    let appState = {
      pin: localStorage.getItem('n_pin') || null,
      txs: JSON.parse(localStorage.getItem('n_txs') || '[]')
    };

    let currentPinInput = '';
    let isCreatingPin = !appState.pin;
    let flow = { type: 'expense', category: '', amount: '0' };

    // PIN
    window.pressPin = function(val) {
      if (currentPinInput.length < 4) {
        currentPinInput += String(val);
        drawPinDots();
        if (currentPinInput.length === 4) {
          setTimeout(checkPin, 100);
        }
      }
    };

    window.delPin = function() {
      currentPinInput = currentPinInput.slice(0, -1);
      drawPinDots();
    };

    window.clearPin = function() {
      currentPinInput = '';
      drawPinDots();
    };

    function drawPinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('pdot-' + i);
        if (dot) {
          if (i < currentPinInput.length) {
            dot.classList.add('active');
          } else {
            dot.classList.remove('active');
          }
        }
      }
      const err = document.getElementById('pinError');
      if (err) err.innerText = '';
    }

    function checkPin() {
      if (isCreatingPin) {
        appState.pin = currentPinInput;
        localStorage.setItem('n_pin', appState.pin);
        document.getElementById('pinScreen').classList.add('hidden');
      } else {
        if (currentPinInput === appState.pin) {
          document.getElementById('pinScreen').classList.add('hidden');
        } else {
          document.getElementById('pinError').innerText = "PIN incorrecto";
          currentPinInput = '';
          drawPinDots();
        }
      }
    }

    window.lockScreen = function() {
      currentPinInput = '';
      drawPinDots();
      isCreatingPin = !appState.pin;
      const title = document.getElementById('pinTitle');
      if (title) title.innerText = isCreatingPin ? "Crea tu PIN de 4 dígitos" : "Introduce tu PIN";
      document.getElementById('pinScreen').classList.remove('hidden');
    };

    // FLUJO 3 PASOS
    window.openFlow = function() {
      flow = { type: 'expense', category: '', amount: '0' };
      document.getElementById('txNoteInput').value = '';
      setStep(1);
      document.getElementById('flowModal').classList.remove('hidden');
    };

    window.closeFlow = function() {
      document.getElementById('flowModal').classList.add('hidden');
    };

    window.setStep = function(stepNum) {
      document.getElementById('modalStepTag').innerText = `PASO ${stepNum} / 3`;
      document.getElementById('flowStep1').classList.toggle('hidden', stepNum !== 1);
      document.getElementById('flowStep2').classList.toggle('hidden', stepNum !== 2);
      document.getElementById('flowStep3').classList.toggle('hidden', stepNum !== 3);

      if (stepNum === 2) renderCategories();
      if (stepNum === 3) {
        document.getElementById('step3Label').innerText = (flow.type === 'expense' ? 'Gasto en: ' : 'Ingreso de: ') + flow.category;
        updateAmountLabel();
      }
    };

    window.setFlowType = function(type) {
      flow.type = type;
      setStep(2);
    };

    function renderCategories() {
      const container = document.getElementById('catGrid');
      container.innerHTML = '';
      const cats = DEFAULT_CATS[flow.type];
      cats.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cat-btn';
        btn.innerHTML = `<span style="font-size:22px;">${c.icon}</span><span>${c.name}</span>`;
        btn.onclick = function() {
          flow.category = c.name;
          setStep(3);
        };
        container.appendChild(btn);
      });
    }

    window.addPad = function(char) {
      if (flow.amount === '0' && char !== '.') {
        flow.amount = char;
      } else {
        if (char === '.' && flow.amount.includes('.')) return;
        const parts = flow.amount.split('.');
        if (parts[1] && parts[1].length >= 2) return;
        flow.amount += char;
      }
      updateAmountLabel();
    };

    window.delPad = function() {
      flow.amount = flow.amount.length <= 1 ? '0' : flow.amount.slice(0, -1);
      updateAmountLabel();
    };

    function updateAmountLabel() {
      const num = parseFloat(flow.amount) || 0;
      document.getElementById('step3Amount').innerText = num.toFixed(2) + ' €';
    }

    window.saveTransaction = function() {
      const val = parseFloat(flow.amount);
      if (!val || val <= 0) {
        alert("Escribe una cantidad válida.");
        return;
      }

      appState.txs.unshift({
        id: Date.now(),
        type: flow.type,
        category: flow.category,
        amount: val,
        note: document.getElementById('txNoteInput').value.trim(),
        date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })
      });

      localStorage.setItem('n_txs', JSON.stringify(appState.txs));
      closeFlow();
      refreshUI();
    };

    function refreshUI() {
      let total = 0, inc = 0, exp = 0;

      appState.txs.forEach(t => {
        if (t.type === 'income') {
          total += t.amount;
          inc += t.amount;
        } else {
          total -= t.amount;
          exp += t.amount;
        }
      });

      document.getElementById('balanceText').innerText = total.toFixed(2) + ' €';
      document.getElementById('incText').innerText = '+' + inc.toFixed(2) + ' €';
      document.getElementById('expText').innerText = '-' + exp.toFixed(2) + ' €';
      document.getElementById('historyCount').innerText = `${appState.txs.length} registros`;

      const list = document.getElementById('txListContainer');
      list.innerHTML = '';

      if (appState.txs.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:24px; color:#777777; font-size:12px; border:1px dashed #262626; border-radius:16px;">Sin movimientos todavía</div>`;
        return;
      }

      appState.txs.forEach(t => {
        const item = document.createElement('div');
        item.className = 'tx-item';
        const isExp = t.type === 'expense';
        item.innerHTML = `
          <div>
            <div style="font-size:14px; font-weight:600;">${t.category}</div>
            <div style="font-size:11px; color:#888888;">${t.note || t.date}</div>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <span style="font-size:14px; font-weight:700; color:${isExp ? '#ffffff' : '#22c55e'};">
              ${isExp ? '-' : '+'}${t.amount.toFixed(2)} €
            </span>
            <button type="button" onclick="delTx(${t.id})" style="background:none; border:none; color:#888888; cursor:pointer; font-size:14px; padding:4px;">✕</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    window.delTx = function(id) {
      if (confirm("¿Borrar este movimiento?")) {
        appState.txs = appState.txs.filter(t => t.id !== id);
        localStorage.setItem('n_txs', JSON.stringify(appState.txs));
        refreshUI();
      }
    };

    // INICIAR
    (function init() {
      const title = document.getElementById('pinTitle');
      if (title) title.innerText = isCreatingPin ? "Crea tu PIN de 4 dígitos" : "Introduce tu PIN";
      refreshUI();
    })();
  </script>
</body>
</html>
